<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Signup | NileMart.com</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" type="text/css" href="styles.css">

  <style>
    .signup-wrapper {
      max-width: 550px;
      margin: 40px auto;
      background: #ffffff;
      padding: 30px 35px;
      border: 1px solid #d5d9d9;
      border-radius: 8px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.06);
    }
    .signup-wrapper h1 {
      font-size: 32px;
      font-weight: 700;
      color: #111;
      margin-bottom: 24px;
    }
    .btn-nilemart {
      background-color: #ffd814;
      border: 1px solid #fcd200;
      color: #111;
      font-weight: bold;
      width: 100%;
      padding: 10px;
      border-radius: 8px;
    }
    .btn-nilemart:hover {
      background-color: #f7ca00;
    }
  </style>
</head>
<body>

  <header>
    <div class="logo"><a href="index.html" style="color:white; text-decoration:none;">Nile<span>mart</span></a></div>
    <div class="search-bar">
      <input type="text" placeholder="Search NileMart...">
      <button type="button">Go</button>
    </div>
    <div class="header-links">
      <a href="index.html">&larr; Back to Storefront</a>
      <a href="#help">Help</a>
    </div>
  </header>

  <nav>
    <ul>
      <li><a href="index.html">Today's Deals</a></li>
      <li><a href="index.html">Electronics</a></li>
      <li><a href="index.html">Books</a></li>
      <li><a href="index.html">Fashion</a></li>
      <li><a href="index.html">NileBasics</a></li>
    </ul>
  </nav>

  <main>
    <div class="signup-wrapper">
      <h1>User Signup</h1>

      <form id="signupForm" action="#" method="POST" novalidate onsubmit="return validateAll(event)">
        
        <div class="mb-3">
          <label for="username" class="form-label">Username:</label>
          <input type="text" 
                 class="form-control" 
                 id="username" 
                 name="username" 
                 placeholder="Enter username" 
                 onfocusout="validate(this)" 
                 onfocus="clearError(this)">
        </div>

        <div class="mb-3">
          <label for="email" class="form-label">Email:</label>
          <input type="text" 
                 class="form-control" 
                 id="email" 
                 name="email" 
                 placeholder="Enter email" 
                 onfocusout="validate(this)" 
                 onfocus="clearError(this)">
        </div>

        <div class="mb-3">
          <label for="password" class="form-label">Password:</label>
          <input type="password" 
                 class="form-control" 
                 id="password" 
                 name="password" 
                 placeholder="Enter password" 
                 onfocusout="validate(this)" 
                 onfocus="clearError(this)">
        </div>

        <div class="mb-4">
          <label for="confirmPassword" class="form-label">Confirm Password:</label>
          <input type="password" 
                 class="form-control" 
                 id="confirmPassword" 
                 name="confirmPassword" 
                 placeholder="Confirm password" 
                 onfocusout="validate(this)" 
                 onfocus="clearError(this)">
        </div>

        <button type="submit" class="btn btn-nilemart mb-3">Create NileMart Account</button>
        
        <div class="text-center">
          <a href="index.html" class="btn btn-light btn-sm text-secondary">Already registered? Return to Storefront</a>
        </div>

      </form>
    </div>
  </main>

  <footer>
    <p>
      <a href="#terms">Conditions of Use</a> | 
      <a href="#privacy">Privacy Notice</a> | 
      <a href="#help">Help</a>
    </p>
    <p style="margin-top: 15px; font-size: 12px; color: #999999;">
      &copy; 2026 NileMart, Inc. or its affiliates. All rights reserved. (IST 256 Storefront Project)
    </p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    // List of error strings used for state detection
    var errorMessages = [
      "Field is required",
      "Invalid email format (e.g. joe@test.com)",
      "Passwords do not match"
    ];

    // Resets red styling and clears error message when user re-focuses the input
    function clearError(obj) {
      if (errorMessages.includes(obj.value.trim())) {
        obj.value = "";
        obj.style.color = ""; // Reset text color
        if (obj.id === "password" || obj.id === "confirmPassword") {
          obj.type = "password"; // Revert to masked input
        }
      }
    }

    // Displays the error inside the textbox and colors it red
    function setError(obj, message) {
      if (obj.type === "password") {
        obj.type = "text"; // Allows the error message to be readable
      }
      obj.value = message;
      obj.style.color = "#FF0000";
    }

    // Validates an individual field
    function validate(obj) {
      var val = obj.value.trim();

      // 1. Required field check (as requested in instructor sample)
      if (val === "" || errorMessages.includes(val)) {
        setError(obj, "Field is required");
        return false;
      }

      // 2. Email format validation
      if (obj.id === "email") {
        var emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
        if (!emailPattern.test(val)) {
          setError(obj, "Invalid email format (e.g. joe@test.com)");
          return false;
        }
      }

      // 3. Confirm Password match validation
      if (obj.id === "confirmPassword") {
        var passField = document.getElementById("password");
        if (passField && val !== passField.value && !errorMessages.includes(passField.value)) {
          setError(obj, "Passwords do not match");
          return false;
        }
      }

      // If valid, ensure standard text color
      obj.style.color = "";
      return true;
    }

    // Validates all fields when clicking the submit button
    function validateAll(event) {
      event.preventDefault();
      var form = document.getElementById("signupForm");
      var inputs = form.querySelectorAll("input");
      var allValid = true;

      // Validate each input field
      inputs.forEach(function(input) {
        if (!validate(input)) {
          allValid = false;
        }
      });

      if (!allValid) {
        return false;
      }

      alert("Account registered successfully! Redirecting to storefront.");
      window.location.href = "index.html";
      return true;
    }
  </script>
</body>
</html>
