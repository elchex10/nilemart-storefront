<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Signup | NileMart.com</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  
  <link rel="stylesheet" type="text/css" href="styles.css">

  <style>
    .signup-wrapper {
      max-width: 550px;
      margin: 40px auto;
      background: #ffffff;
      padding: 30px 35px;
      border: 1px solid #d5d9d9;
      border-radius: 8px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.06);
    }
    .signup-wrapper h1 {
      font-size: 32px;
      font-weight: 700;
      color: #111;
      margin-bottom: 24px;
    }
    .btn-nilemart {
      background-color: #ffd814;
      border: 1px solid #fcd200;
      color: #111;
      font-weight: bold;
      width: 100%;
      padding: 10px;
      border-radius: 8px;
    }
    .btn-nilemart:hover {
      background-color: #f7ca00;
    }
  </style>
</head>
<body>

  <header>
    <div class="logo"><a href="storefront.html" style="color:white; text-decoration:none;">Nile<span>mart</span></a></div>
    <div class="search-bar">
      <input type="text" placeholder="Search NileMart...">
      <button type="button">Go</button>
    </div>
    <div class="header-links">
      <a href="storefront.html">&larr; Back to Storefront</a>
      <a href="#help">Help</a>
    </div>
  </header>

  <nav>
    <ul>
      <li><a href="storefront.html">Today's Deals</a></li>
      <li><a href="storefront.html">Electronics</a></li>
      <li><a href="storefront.html">Books</a></li>
      <li><a href="storefront.html">Fashion</a></li>
      <li><a href="storefront.html">NileBasics</a></li>
    </ul>
  </nav>

  <main>
    <div class="signup-wrapper">
      <h1>User Signup</h1>

      <form action="#" method="POST" onsubmit="return validatePasswords(event)">
        
        <div class="mb-3">
          <label for="username" class="form-label">Username:</label>
          <input type="text" class="form-control" id="username" name="username" placeholder="Enter username" required>
        </div>

        <div class="mb-3">
          <label for="email" class="form-label">Email:</label>
          <input type="email" class="form-control" id="email" name="email" placeholder="Enter email" required>
        </div>

        <div class="mb-3">
          <label for="password" class="form-label">Password:</label>
          <input type="password" class="form-control" id="password" name="password" placeholder="Enter password" required>
        </div>

        <div class="mb-4">
          <label for="confirmPassword" class="form-label">Confirm Password:</label>
          <input type="password" class="form-control" id="confirmPassword" name="confirmPassword" placeholder="Confirm password" required>
        </div>

        <button type="submit" class="btn btn-nilemart mb-3">Create NileMart Account</button>
        
        <div class="text-center">
          <a href="storefront.html" class="btn btn-light btn-sm text-secondary">Already registered? Return to Storefront</a>
        </div>

      </form>
    </div>
  </main>

  <footer>
    <p>
      <a href="#terms">Conditions of Use</a> | 
      <a href="#privacy">Privacy Notice</a> | 
      <a href="#help">Help</a>
    </p>
    <p style="margin-top: 15px; font-size: 12px; color: #999999;">
      &copy; 2026 NileMart, Inc. or its affiliates. All rights reserved. (IST 256 Storefront Project)
    </p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    function validatePasswords(event) {
      event.preventDefault();
      var p1 = document.getElementById('password').value;
      var p2 = document.getElementById('confirmPassword').value;
      if (p1 !== p2) {
        alert('Passwords do not match! Please verify both fields.');
        return false;
      }
      alert('Account registered successfully! Redirecting to storefront.');
      window.location.href = 'storefront.html';
      return true;
    }
  </script>
</body>
</html>
